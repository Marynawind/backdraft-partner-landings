<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Без этой строки телефон верстает страницу на 980 px и уменьшает её до
     ширины экрана: текст выходит вдвое мельче, а колонка условий занимает
     две трети ширины. В магазине тег даёт тема BigCommerce, а на GitHub Pages
     боевой файл лежит голым фрагментом — своего <head> у него нет и быть
     не должно, его вставляют в «Page Content». Поэтому превью показывает
     тот же файл в рамке: внутри рамки вьюпорт равен ширине экрана,
     и мобильная вёрстка видна такой, какой её увидит покупатель. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meprolight Optics Rebate — превью</title>
<style>
  html,body{margin:0;height:100%;background:#333;}
  iframe{display:block;width:100%;height:100%;border:0;}
</style>
</head>
<body>
<!-- Ссылки уводим в ВЕРХНЕЕ окно, а не в рамку.

     Магазин отдаёт `x-frame-options: deny` — показывать себя внутри рамки он
     запрещает. Клик по кнопке уводил бы рамку на backdraftsuppressors.com,
     браузер отказывался бы его рисовать, и снаружи это выглядит как «кнопка
     не работает». В самом магазине рамки нет и проблемы нет — она живёт
     только в превью, поэтому и лечится здесь, а не в боевом файле.

     Якоря внутри страницы (#how-to-redeem) не трогаем: с target=_top они
     вытащили бы голый фрагмент в верхнее окно, то есть ровно ту вёрстку
     на 980px, ради которой рамка и заведена. -->
<iframe id="page" src="bigcommerce-page.html" title="Meprolight Optics Rebate"></iframe>
<script>
  document.getElementById('page').addEventListener('load', function () {
    var d = this.contentDocument;
    if (!d) return;                       // чужой источник — молча выходим
    d.querySelectorAll('a[href]').forEach(function (a) {
      if (a.getAttribute('href').charAt(0) !== '#') a.target = '_top';
    });
  });
</script>
</body>
</html>
