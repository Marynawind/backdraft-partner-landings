<!-- Без этой строки телефон верстает страницу на 980 px и уменьшает её до
     ширины экрана: текст выходит вдвое мельче, а колонка условий занимает
     две трети ширины. В магазине тег даёт тема BigCommerce, а на GitHub Pages
     боевой файл лежит голым фрагментом — своего <head> у него нет и быть
     не должно, его вставляют в «Page Content». Поэтому превью показывает
     тот же файл в рамке: внутри рамки вьюпорт равен ширине экрана,
     и мобильная вёрстка видна такой, какой её увидит покупатель. -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meprolight Optics Rebate — превью</title>
<style>
  html,body{margin:0;height:100%;background:#333;}
  iframe{display:block;width:100%;height:100%;border:0;}
</style>
</head>
<body>
<iframe src="bigcommerce-page.html" title="Meprolight Optics Rebate"></iframe>
</body>
